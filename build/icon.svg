<?xml version="1.0" encoding="UTF-8"?>
<!--
  Ashiato (足跡ジャーナル) app icon - the master for every icon size (see scripts/gen-icon.mjs).

  Follows the elec series layout shared with elecxzy, elecxterm and elecdex:
  the app's own motif on a card, with the series "E" badge overlapping the
  bottom-left corner (a #0ea5e9 disc with a white rim and three rounded bars).

  Ashiato's motif is its day view: a dark timeline pane whose lanes carry the
  same category colours as the app, and a trail of amber footprints walking up
  across the card - the record of the day it keeps.
-->
<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Ashiato</title>
  <defs>
    <!-- one right footprint, 40 x 60, heel at the bottom -->
    <g id="foot">
      <path d="M21 19 C33 19 36 33 32 44 C29 54 24 60 18 60 C11 60 8 53 9 45 C10 37 8 19 21 19 Z"/>
      <circle cx="9.5" cy="12" r="4.6"/>
      <circle cx="18.5" cy="6.5" r="5"/>
      <circle cx="27.5" cy="7.5" r="4.4"/>
      <circle cx="35" cy="13.5" r="3.6"/>
    </g>
  </defs>

  <!-- Card, with the series' offset shadow for depth -->
  <rect x="44" y="24" width="184" height="216" rx="16" fill="#94a3b8"/>
  <rect x="40" y="20" width="184" height="216" rx="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Timeline pane: three lanes of the day -->
  <rect x="52" y="32" width="160" height="70" rx="8" fill="#0f1115"/>
  <g stroke="#2a2f3a" stroke-width="1.5">
    <path d="M92 38 V96 M132 38 V96 M172 38 V96"/>
  </g>
  <rect x="60" y="42" width="64" height="12" rx="4" fill="#7aa2f7"/>
  <rect x="130" y="42" width="44" height="12" rx="4" fill="#f7768e"/>
  <rect x="180" y="42" width="24" height="12" rx="4" fill="#9ece6a"/>
  <rect x="60" y="61" width="18" height="10" rx="2" fill="#bb9af7"/>
  <rect x="78" y="61" width="30" height="10" rx="2" fill="#7aa2f7"/>
  <rect x="108" y="61" width="12" height="10" rx="2" fill="#73daca"/>
  <rect x="130" y="61" width="36" height="10" rx="2" fill="#bb9af7"/>
  <rect x="166" y="61" width="38" height="10" rx="2" fill="#9ece6a"/>
  <g fill="#f5c97a">
    <path d="M102 84 l6 -6 l6 6 l-6 6 Z"/>
    <path d="M150 84 l6 -6 l6 6 l-6 6 Z"/>
    <circle cx="186" cy="84" r="5" fill="#bb9af7"/>
  </g>

  <!-- Footprint trail walking up to the right, past the badge -->
  <!-- each use: centre (cx cy), tilt, size; the left foot is the mirrored right one -->
  <g fill="#e0a33a">
    <use href="#foot" transform="translate(146 194) rotate(20) scale(-1.2 1.2) translate(-21 -33)"/>
    <use href="#foot" transform="translate(189 140) rotate(20) scale(1.2) translate(-21 -33)"/>
  </g>

  <!-- elec series badge: the "E" mark, bottom-left -->
  <circle cx="68" cy="180" r="52" fill="#0ea5e9" stroke="#ffffff" stroke-width="8"/>
  <path d="M44 156 H92 M44 180 H76 M44 204 H92" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
</svg>
